# Production configuration.
#
# Two roles, deliberately different models:
#   student — asks the questions, judges answers, merges responses
#   teacher — produces the answers that become training data
# Same-model grading is self-play and makes the correctness dimension meaningless.
#
# Endpoints and model names come from .env via ${VAR} expansion at load time,
# so no hostname ever needs to live in this repository.

# ── Student / research agent ────────────────────────────────
research_provider: openai
research_base_url: ${STUDENT_BASE_URL}
research_model: ${STUDENT_MODEL}
research_api_key: ${STUDENT_API_KEY}
research_max_tokens: 4096
research_temperature: 0.8

# ── Teacher ─────────────────────────────────────────────────
teacher_provider: openai
teacher_base_url: ${TEACHER_BASE_URL}
teacher_model: ${TEACHER_MODEL}
teacher_api_key: ${TEACHER_API_KEY}
teacher_max_tokens: 16000
teacher_temperature: 0.3

# Infrastructure
redis_url: redis://localhost:6379/0

# Storage paths
dataset_base_path: /root/datasets
logs_base_path: /root/logs
checkpoint_base_path: /root/checkpoints
config_base_path: /root/config

# Dataset storage
raw_txt_rotation_size_gb: 2.0
enable_immediate_sync: true

# Pipeline
# max_questions_per_topic is enforced per topic in question_worker. When a topic
# hits the cap it is retired and a fresh topic is pulled from the rotation pool.
# Without this the pipeline loops on one topic forever.
max_questions_per_topic: 30
difficulty_levels:
  - beginner
  - intermediate
  - expert
  - advanced
  - research
min_answer_length: 800
min_quality_score: 0.68
quality_retry_attempts: 2

# Exhaustion detection
exhaustion_similarity_threshold: 0.90
exhaustion_min_questions: 20

# Duplicate detection (exact is always 1.0; this is the semantic layer)
duplicate_exact_threshold: 1.0
duplicate_semantic_threshold: 0.90
embedding_cache_size: 50000

# Workers. Answer workers are I/O bound on a remote GPU endpoint, so they scale
# with that endpoint's concurrency rather than the local CPU count.
num_topic_workers: 1
num_question_workers: 3
num_answer_workers: 8
num_quality_workers: 4

# Monitoring
log_level: INFO
enable_rich_dashboard: true
dashboard_refresh_rate: 2.0

# Checkpointing
checkpoint_interval_minutes: 15
auto_resume_on_start: true

# Rate limiting
api_request_delay: 0.5
max_retries: 5
retry_base_delay: 3.0

# Multi-teacher
teachers_config_path: config/teachers.yaml
enable_multi_teacher: true
min_teachers_required: 1
merger_consensus_threshold: 2
teacher_query_timeout: 300.0
teacher_concurrency_limit: 12
